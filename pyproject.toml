[project]
name = "llm-trace-lite"
version = "0.1.0"
description = "Log OpenAI-compatible chat completions to SQLite with latency, tokens and rough cost"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mohamed Tahoon" }]
dependencies = []

[project.scripts]
trace = "llm_trace_lite.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["llm_trace_lite"]
